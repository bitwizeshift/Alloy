min_version: 2.0.0

templates:
  check: go -C tools run ./alloy-cli check

pre-commit:
  parallel: true
  jobs:
    - name: c++ codestyle
      skip: true
      glob: "*.{h,hpp,c,cpp}"
      run: clang-format --dry-run --Werror {staged_files}
      fail_text: Fix with `lefthook run fix --job "c++ codestyle"`

    - name: c++ clang-tidy
      glob: "*.{h,hpp,c,cpp}"
      run: "{check} cpp-clang-tidy {staged_files}"
      fail_text: Fix with `lefthook run fix --job "c++ clang-tidy"`

    - name: license header
      glob: "*.{h,hpp,c,cpp}"
      # Sources adapted from other projects keep the license notices of the
      # projects that they came from.
      exclude:
        - lib/alloy-core/include/alloy/core/string/encoding/ansi_encoding.hpp
        - lib/alloy-core/include/alloy/core/string/encoding/latin1_encoding.hpp
        - lib/alloy-core/include/alloy/core/string/encoding/utf16_encoding.hpp
        - lib/alloy-core/include/alloy/core/string/encoding/utf32_encoding.hpp
        - lib/alloy-core/include/alloy/core/string/encoding/utf8_encoding.hpp
        - lib/alloy-core/include/alloy/core/string/encoding/wide_encoding.hpp
        - lib/alloy-core/include/alloy/core/utilities/result.hpp
        - lib/alloy-core/src/alloy/core/math/quaternion.cpp
      run: "{check} license-header {staged_files}"
      fail_text: See `go -C tools run ./alloy-cli check license-header --help`

    - name: license year
      run: "{check} license-year"
      fail_text: Fix with `lefthook run fix --job "license year"`

    - name: trailing newline
      glob: "*.{h,hpp,c,cpp,md,py}"
      run: "{check} trailing-newline {staged_files}"
      fail_text: Fix with `lefthook run fix --job "trailing newline"`

    - name: whitespace
      glob: "*.{h,hpp,c,cpp,md,py}"
      run: "{check} whitespace {staged_files}"
      fail_text: Fix with `lefthook run fix --job "whitespace"`

commit-msg:
  jobs:
    # Lefthook hides unstaged changes while pre-commit runs, so files with
    # both staged and unstaged changes can only be found after it finishes.
    - name: partially staged files
      files: git diff --cached --name-only --diff-filter=d
      run: |
        partial=$(git diff --name-only -- {files})
        if [ -n "$partial" ]; then
          {
            printf '\033[33m%s\n' \
              "CAUTION: The following staged files have unstaged modifications:"
            printf '%s\n' "$partial" | sed 's/^/ • /'
            printf '%s\033[0m\n' "This can be ignored if this was intentional."
          } >&2
        fi

    - name: commit message
      run: "{check} commit-msg {1}"

fix:
  jobs:
    - name: c++ codestyle
      skip: true
      glob: "*.{h,hpp,c,cpp}"
      run: clang-format -i {staged_files}

    - name: c++ clang-tidy
      glob: "*.{h,hpp,c,cpp}"
      run: "{check} cpp-clang-tidy --fix {staged_files}"

    - name: license year
      run: "{check} license-year --fix"

    - name: trailing newline
      glob: "*.{h,hpp,c,cpp,md,py}"
      run: "{check} trailing-newline --fix {staged_files}"

    - name: whitespace
      glob: "*.{h,hpp,c,cpp,md,py}"
      run: "{check} whitespace --fix {staged_files}"

modernize:
  jobs:
    - name: c++ modernize
      glob: "*.{hpp,cpp}"
      run: >-
        clang-tidy
        -p=build
        --format-style=file
        --checks='-*,modernize-*'
        --warnings-as-errors='-*'
        --use-color
        --fix
        --fix-errors
        --quiet
        {staged_files}
