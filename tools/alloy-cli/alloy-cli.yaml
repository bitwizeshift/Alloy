# yaml-language-server: $schema=https://raw.githubusercontent.com/bitwizeshift/go-cli/refs/heads/master/command.schema.json
name: alloy-cli
summary: Developer tooling for the Alloy repository
description: |
  alloy-cli bundles the developer tooling for the Alloy repository: the
  checks that the git hooks run, and the generators for derived artifacts.

  File paths given to any command are relative to the repository root, which
  is located with git. This matches the paths that lefthook passes to its
  jobs, regardless of the directory the tool is run from.
issue-url: https://github.com/bitwizeshift/alloy/issues

commands:
  Hooks:
    - name: check
      summary: Check files and commit messages against the project standards
      description: |
        Checks that files and commit messages follow the project standards.
        Each check is run by a lefthook job, and can be run by hand over any
        files.

        Checks that can repair the problems they find do so with --fix.
      commands:
        Commit:
          - name: commit-msg
            summary: Check a commit message against the commit standards
            description: |
              Checks that a commit message follows doc/commit-standards.md:
              the 50/72 formatting rules, a single Change-Category and
              Change-Impact trailer, and Component trailers naming components
              of the repository.

              Comment lines, and everything below a scissors line, are
              ignored, as git does when it records the commit.
            examples:
              - alloy-cli check commit-msg .git/COMMIT_EDITMSG
        Files:
          - name: cpp-clang-tidy
            summary: Run clang-tidy over the changed lines of C and C++ files
            description: |
              Runs clang-tidy over C and C++ files, reporting only the
              diagnostics on lines that differ from HEAD, plus five lines of
              context around each change. A file without such changes is
              checked in full.

              clang-tidy reads how each file is compiled from the
              compile_commands.json in the build directory.
            examples:
              - alloy-cli check cpp-clang-tidy lib/alloy-core/src/alloy/core/assert.cpp
              - alloy-cli check cpp-clang-tidy --fix -j 4 lib/alloy-core/src/alloy/core/assert.cpp
          - name: header-guard
            summary: Check that C and C++ headers have a well-formed include guard
            description: |
              Checks that each C and C++ header is wrapped in an include guard
              named after its path, relative to the first include or src
              directory in it, in uppercase and with every separator and dot
              replaced with an underscore. The guard of
              lib/alloy-core/include/alloy/core/assert.hpp is
              ALLOY_CORE_ASSERT_HPP.

              The #ifndef and #define of the guard are the first lines after
              the comments that open the header, and are followed by a block
              that makes MSVC skip the header once it has been included:

              * #ifdef _MSC_VER
              * # pragma once
              * #endif

              The last line of the header is the #endif that closes the guard,
              with the guard name in a comment, as in
              "#endif /* ALLOY_CORE_ASSERT_HPP */".

              With --fix, the names in the guard are corrected, the MSVC block
              is added or replaced, includes between the #define and the MSVC
              block are moved below it, and the comment on the closing #endif
              is rewritten. Headers without an #ifndef and #define at the top and
              an #endif at the bottom are left for a manual fix.
            examples:
              - alloy-cli check header-guard lib/alloy-core/include/alloy/core/assert.hpp
              - alloy-cli check header-guard --fix lib/alloy-core/include/alloy/core/assert.hpp
          - name: license-header
            summary: Check that C, C++ and CMake files start with their license header
            description: |
              Checks that each C, C++ and CMake file starts with the short
              license header that refers to the LICENSE file at the repository
              root. In C and C++ files, it is made of the lines:

              * // Copyright (c) Matthew Rodusek
              * // SPDX-License-Identifier: MIT
              * // See the LICENSE file at the root of this repository for the full text.

              CMake modules hold the same lines, without the leading //, in a
              bracket comment: #[[ on the first line, each line of the header
              indented by two spaces, and ]] on the line after them.

              C and C++ files under a test or benchmark directory are dedicated
              to the public domain instead, and start with the lines:

              * // SPDX-License-Identifier: CC0-1.0
              * // Any copyright for this file is dedicated to the Public Domain.
              * // See https://creativecommons.org/publicdomain/zero/1.0/ for the full text.
            examples:
              - alloy-cli check license-header lib/alloy-core/src/alloy/core/assert.cpp
          - name: license-year
            summary: Check that the LICENSE copyright years reach the current year
            description: |
              Checks that the copyright notice in the LICENSE file at the
              repository root is a single range of years, from the year the
              work began to the current year. LICENSE is the only file that
              records copyright years.
            examples:
              - alloy-cli check license-year
              - alloy-cli check license-year --fix
          - name: trailing-newline
            summary: Check that files end with a newline
            examples:
              - alloy-cli check trailing-newline README.md
              - alloy-cli check trailing-newline --fix README.md
          - name: whitespace
            summary: Check that lines have no trailing whitespace
            examples:
              - alloy-cli check whitespace README.md
              - alloy-cli check whitespace --fix README.md

  Tools:
    - name: generate
      summary: Generate artifacts from the repository sources
      commands:
        default:
          - name: documentation
            aliases:
              - docs
            summary: Generate the API documentation with doxygen
            description: |
              Generates the API documentation by running doxygen with the
              .codedocs configuration at the repository root.
